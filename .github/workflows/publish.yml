name: publish

# Publica no npm quando uma tag vN.N.N e empurrada. Sem token e sem passkey:
# o npm confia no OIDC do proprio Actions (trusted publishing), o que exige
# `id-token: write` e npm >= 11.5.1, mais recente que o do setup-node.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm install -g npm@latest

      - name: a tag tem que bater com a versao do package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          test "$tag" = "$pkg" || { echo "tag $tag != package.json $pkg"; exit 1; }

      - run: npm publish --provenance --access public
