name: publish

# Publica no npm quando a versao do package.json sobe no main. Sem token e sem passkey:
# o npm confia no OIDC do proprio Actions (trusted publishing), o que exige
# `id-token: write` e npm >= 11.5.1, mais recente que o do setup-node.
# Versao que ja esta no npm e ignorada, entao um push que nao mexe na versao nao publica nada.
# `workflow_dispatch` roda a mesma coisa pela aba Actions.
on:
  push:
    branches: [main]
    paths: [package.json, .github/workflows/publish.yml]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm install -g npm@latest

      - name: esta versao ja foi publicada?
        id: ver
        run: |
          name="$(node -p "require('./package.json').name")"
          pkg="$(node -p "require('./package.json').version")"
          if npm view "$name@$pkg" version >/dev/null 2>&1; then
            echo "$name@$pkg ja esta no npm: nada a publicar"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.ver.outputs.skip != 'true'
        run: npm publish --provenance --access public
