name: regression

# Roda as fixtures de regressao visual contra o styles.css REAL do
# @emdash-cms/admin. Instala com bun (regra da casa; o publish.yml continua no
# npm porque o trusted publishing do npm exige o OIDC do proprio npm).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  skin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run typecheck
      - run: bun run surface -- --check
      - run: bun run test
